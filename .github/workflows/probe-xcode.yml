name: probe-xcode
on:
  workflow_dispatch:
jobs:
  intel:
    runs-on: macos-15-intel
    steps:
      - run: |
          sw_vers
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "no xcode bundles"
          xcodebuild -version
          xcodebuild -showsdks 2>/dev/null | tail -20
  arm26:
    runs-on: macos-26
    steps:
      - run: |
          sw_vers
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "no xcode bundles"
          xcodebuild -version
